# Fires the first time a session adds "Giulio" to a skill file: a SKILL.md, or any .md under
# a skills/<name>/ folder. Gated on the slip itself, so a session that writes "the user"
# all along never spends it. skill-creator eval output, in <skill>-workspace/, is excluded.
[check]
uses = file-write
path = (^|[/[:space:]'"])SKILL\.md([^[:alnum:]._-]|$)|skills/[^/[:space:]'"]+/[^[:space:]'"]*\.md([^[:alnum:]._-]|$)
exclude = -workspace/
match = Giulio
