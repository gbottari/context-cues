# Fires the first time a session writes a document an agent reads: a SKILL.md, AGENTS.md
# or CLAUDE.md, or a file in a skill folder or under .claude/agents, commands or rules.
# Loading the writing-for-agents skill first spends it silently: the skill says it all.
[suppress]
uses = tool-input
tools = Skill
field = skill
match = ^mattpocock-skills:writing-for-agents$

# A skill-creator eval writes into <skill>-workspace/ folders; those are not docs.
[check]
uses = file-write
path = (^|[/[:space:]'"])(SKILL|AGENTS|CLAUDE)\.md([^[:alnum:]._-]|$)|/(\.claude/(agents|commands|rules)|skills/[^/[:space:]'"]+)/[^[:space:]'"]*\.md([^[:alnum:]._-]|$)
exclude = [^/]-workspace/
