# Fires the first time a session commits in a git repository that has no remote, once
# per repository: has-no-remote.sh returns the repository as the key, and as ${REPO}.
[check]
uses = command
match = git([[:space:]]+(-C[[:space:]]+[^[:space:]]+|-c[[:space:]]+[^[:space:]]+|--[a-z-]+(=[^[:space:]]+)?))*[[:space:]]+commit([[:space:]]|$)

[check]
run = has-no-remote.sh
