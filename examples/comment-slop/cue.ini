# Fires the first time in a session that a commit's added lines are mostly comments, in any
# language cloc counts. comment-share.sh does the counting and stays silent without cloc.
[check]
uses = command
match = git([[:space:]]+(-C[[:space:]]+[^[:space:]]+|-c[[:space:]]+[^[:space:]]+|--[a-z-]+(=[^[:space:]]+)?))*[[:space:]]+commit([[:space:]]|$)

[check]
run = comment-share.sh
