name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          grep --version | head -1 || true
      - name: Tests
        run: bash tests/run.sh

  markdown:
    # Every .md file keeps one line per paragraph (.prettierrc.json sets proseWrap: never).
    # Fix locally with: npx prettier@3.9.10 --write '**/*.md'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prettier check
        run: npx --yes prettier@3.9.10 --check '**/*.md'
