name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          grep --version | head -1 || true
          awk --version 2>/dev/null | head -1 || awk -W version 2>/dev/null | head -1 || true
          git --version
      - name: Diagnose the CR in joined cue texts (temporary)
        if: runner.os == 'Windows'
        run: |
          echo "--- join lines of dispatch.sh as checked out"
          grep -n -A2 'text="\$text' hooks/dispatch.sh | od -c | head -8
          d=$(mktemp -d)
          for c in one two; do
            mkdir -p "$d/$c"
            printf '[check]\nuses = tool-input\ntools = Probe\nmatch = go\n' >"$d/$c/cue.ini"
            printf '%s says hi\n' "$c" >"$d/$c/prompt.md"
          done
          printf '%s' '{"session_id":"diag","tool_name":"Probe","tool_input":{"q":"go"},"cwd":"/"}' |
            CONTEXT_CUES_DIR=$d XDG_RUNTIME_DIR=$d/m bash hooks/dispatch.sh >"$d/raw.json"
          echo "--- dispatcher raw output"
          od -c "$d/raw.json" | head -12
          echo "--- jq -r of it, raw bytes"
          jq -r .hookSpecificOutput.additionalContext <"$d/raw.json" | od -c | head -6
          echo "--- jq -r of it, through \$( )"
          out=$(jq -r .hookSpecificOutput.additionalContext <"$d/raw.json"); printf '%q\n' "$out"
          echo "--- jq -r of a two-line string, through \$( )"
          v=$(jq -rn '"a\nb"'); printf '%q\n' "$v"
          echo "--- jq -n --arg with a newline, raw bytes"
          jq -cn --arg t $'a\n\nb' '{t:$t}' | od -c | head -4
      - name: Tests
        run: bash tests/run.sh

  markdown:
    # Every .md file keeps one line per paragraph (.prettierrc.json sets proseWrap: never).
    # Fix locally with: npx prettier@3.9.10 --write '**/*.md'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prettier check
        run: npx --yes prettier@3.9.10 --check '**/*.md'

  plugin:
    # The plugin files parse, and the marketplace entry names the same plugin as plugin.json,
    # which an install by name needs. Run `claude plugin validate .` locally for the full check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin manifests
        run: |
          jq -e '.name and .version and .description' .claude-plugin/plugin.json
          jq -e '.name and .owner.name and (.plugins | length > 0)' .claude-plugin/marketplace.json
          test "$(jq -r .name .claude-plugin/plugin.json)" = "$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)"
          jq -e '.hooks.SessionStart[0].hooks[0].command | contains("rearm.sh")' hooks/hooks.json
          jq -e '.hooks.PostToolUse[0] | (.matcher | contains("Bash")) and (.hooks[0].command | contains("dispatch.sh"))' hooks/hooks.json
